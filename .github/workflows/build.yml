name: Kaldi Phoneme API - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # 2. Install Node deps (for demo.js)
      # =========================
      - name: Install Node dependencies
        run: |
          npm install

      # =========================
      # 3. Build Docker image
      # =========================
      - name: Build Docker image
        run: |
          docker build -t kaldi-phoneme-api .

      # =========================
      # 4. Run container
      # =========================
      - name: Run container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name kaldi_test \
            kaldi-phoneme-api

      # =========================
      # 5. Wait for API ready
      # =========================
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/health; then
              echo "API is up"
              break
            fi
            echo "Waiting for API..."
            sleep 5
          done

      # =====================================================
      # 6. INTERNAL TEST (inside container, direct curl)
      # =====================================================
      - name: Internal test - container self check
        run: |
          echo "=== Internal test: calling API inside container ==="
          docker exec kaldi_test bash -c "
            cd /app && \
            if [ ! -f demo/test.wav ]; then
              echo 'ERROR: demo/test.wav not found in container'
              exit 1
            fi && \
            curl -X POST http://localhost:5000/recognize \
              -F 'file=@demo/test.wav'
          "

      # =====================================================
      # 7. EXTERNAL TEST (Node.js demo.js)
      # =====================================================
      - name: External test - demo.js
        run: |
          echo "=== External test: calling API via demo.js ==="
          node demo.js

      # =========================
      # 8. Show logs if failed
      # =========================
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs kaldi_test

      # =========================
      # 9. Cleanup
      # =========================
      - name: Cleanup
        if: always()
        run: |
          docker stop kaldi_test || true
          docker rm kaldi_test || true
